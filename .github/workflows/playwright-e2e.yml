name: Playwright authenticated property smoke

on:
  push:
    paths:
      - .github/workflows/playwright-e2e.yml
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  property-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_TESTING: "1"
      E2E_BASE_URL: http://localhost:3000
      E2E_API_URL: http://localhost:8000
      E2E_USERNAME: e2e-browser-smoke
      E2E_EMAIL: e2e-browser-smoke@example.invalid

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/Lastnext/package-lock.json

      - name: Generate isolated CI configuration
        shell: bash
        run: |
          set -euo pipefail
          database_password="$(openssl rand -hex 24)"
          e2e_password="$(openssl rand -hex 24)"
          session_secret="$(openssl rand -hex 32)"
          django_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$database_password"
          echo "::add-mask::$e2e_password"
          echo "::add-mask::$session_secret"
          echo "::add-mask::$django_secret"
          {
            echo "E2E_PASSWORD=$e2e_password"
            echo "E2E_SESSION_SECRET=$session_secret"
            echo "POSTGRES_DB=mylubd_e2e"
            echo "POSTGRES_USER=mylubd_e2e"
            echo "POSTGRES_PASSWORD=$database_password"
            echo "SQL_DATABASE=mylubd_e2e"
            echo "SQL_USER=mylubd_e2e"
            echo "SQL_PASSWORD=$database_password"
          } >> "$GITHUB_ENV"
          {
            echo "POSTGRES_DB=mylubd_e2e"
            echo "POSTGRES_USER=mylubd_e2e"
            echo "POSTGRES_PASSWORD=$database_password"
            echo "SQL_DATABASE=mylubd_e2e"
            echo "SQL_USER=mylubd_e2e"
            echo "SQL_PASSWORD=$database_password"
            echo "DJANGO_SECRET_KEY=$django_secret"
            echo "E2E_TESTING=1"
            echo "E2E_PASSWORD=$e2e_password"
            echo "AUTH0_SESSION_SECRET=$session_secret"
            echo "AUTH0_DOMAIN="
            echo "AUTH0_ISSUER="
            echo "AUTH0_ISSUER_BASE_URL="
            echo "AUTH0_AUDIENCE="
          } > .env.local

      - name: Install frontend dependencies
        working-directory: frontend/Lastnext
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend/Lastnext
        run: npx playwright install --with-deps chromium

      - name: Start application stack
        run: docker compose -f docker-compose.dev.yml up -d --build db backend frontend

      - name: Wait for backend
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://localhost:8000/api/v1/health/ > /dev/null; then
              exit 0
            fi
            if (( attempt == 60 )); then
              docker compose -f docker-compose.dev.yml logs --no-color backend
              exit 1
            fi
            sleep 2
          done

      - name: Seed isolated E2E fixture
        run: |
          docker compose -f docker-compose.dev.yml exec -T \
            -e E2E_TESTING=1 \
            -e E2E_PASSWORD="$E2E_PASSWORD" \
            backend python manage.py seed_e2e_smoke --reset
          docker compose -f docker-compose.dev.yml exec -T \
            -e E2E_TESTING=1 \
            -e E2E_PASSWORD="$E2E_PASSWORD" \
            backend python manage.py seed_e2e_smoke

      - name: Wait for frontend
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://localhost:3000/api/health/ > /dev/null; then
              exit 0
            fi
            if (( attempt == 60 )); then
              docker compose -f docker-compose.dev.yml logs --no-color frontend
              exit 1
            fi
            sleep 2
          done

      - name: Run authenticated property smoke
        working-directory: frontend/Lastnext
        run: npm run test:e2e -- e2e/session-property.spec.ts

      - name: Collect application logs on failure
        if: failure()
        run: |
          mkdir -p ci-artifacts
          docker compose -f docker-compose.dev.yml logs --no-color backend > ci-artifacts/backend.log
          docker compose -f docker-compose.dev.yml logs --no-color frontend > ci-artifacts/frontend.log

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            frontend/Lastnext/playwright-report/
            frontend/Lastnext/test-results/
            !frontend/Lastnext/.playwright/**
            ci-artifacts/

      - name: Stop application stack
        if: always()
        run: docker compose -f docker-compose.dev.yml down --volumes --remove-orphans
