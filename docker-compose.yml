services:
  frontend:
    build:
      context: ./frontend/Lastnext
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_AUTH0_BASE_URL: ${NEXT_PUBLIC_AUTH0_BASE_URL}
        NEXT_PUBLIC_AUTH0_ISSUER_BASE_URL: ${NEXT_PUBLIC_AUTH0_ISSUER_BASE_URL}
        NEXT_PUBLIC_AUTH0_DOMAIN: ${NEXT_PUBLIC_AUTH0_DOMAIN}
        NEXT_PUBLIC_AUTH0_CLIENT_ID: ${NEXT_PUBLIC_AUTH0_CLIENT_ID}
        NEXT_PUBLIC_AUTH0_AUDIENCE: ${NEXT_PUBLIC_AUTH0_AUDIENCE}
        NEXT_PUBLIC_MEDIA_URL: ${NEXT_PUBLIC_MEDIA_URL}
    container_name: nextjs-frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PRIVATE_API_URL: ${NEXT_PRIVATE_API_URL}
      NEXT_PUBLIC_MEDIA_URL: ${NEXT_PUBLIC_MEDIA_URL}
      NEXT_MEDIA_API_URL: ${NEXT_MEDIA_API_URL:-http://backend:8000}
      API_URL: ${API_URL}
      APP_BASE_URL: ${APP_BASE_URL}
      AUTH0_BASE_URL: ${AUTH0_BASE_URL}
      AUTH0_ISSUER_BASE_URL: ${AUTH0_ISSUER_BASE_URL}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID}
      AUTH0_CLIENT_SECRET: ${AUTH0_CLIENT_SECRET}
      AUTH0_SECRET: ${AUTH0_SECRET}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE}
      NEXT_PUBLIC_AUTH0_BASE_URL: ${NEXT_PUBLIC_AUTH0_BASE_URL:-${AUTH0_BASE_URL}}
      NEXT_PUBLIC_AUTH0_ISSUER_BASE_URL: ${NEXT_PUBLIC_AUTH0_ISSUER_BASE_URL:-${AUTH0_ISSUER_BASE_URL}}
      NEXT_PUBLIC_AUTH0_DOMAIN: ${NEXT_PUBLIC_AUTH0_DOMAIN:-${AUTH0_DOMAIN}}
      NEXT_PUBLIC_AUTH0_CLIENT_ID: ${NEXT_PUBLIC_AUTH0_CLIENT_ID:-${AUTH0_CLIENT_ID}}
      NEXT_PUBLIC_AUTH0_AUDIENCE: ${NEXT_PUBLIC_AUTH0_AUDIENCE:-${AUTH0_AUDIENCE}}
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health/', response => process.exit(response.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    # Frontend traffic is routed through Nginx.
    expose:
      - "3000"
    depends_on:
      - backend
      - db
    networks:
      app-network:
        aliases:
          - frontend
          - nextjs-frontend

  redis:
    image: redis:7-alpine
    container_name: redis-cache
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD to a strong URL-safe password}
    volumes:
      - redis_data:/data
    # Generate a root/Redis-only config so the password is not placed in the
    # Redis process arguments. URL-safe values also avoid config injection.
    command:
      - /bin/sh
      - -ec
      - |
        password="$${REDIS_PASSWORD}"
        normalized="$$(printf '%s' "$${password}" | tr '[:upper:]' '[:lower:]')"
        case "$${normalized}" in
          redis|password|changeme|secret|default|admin)
            echo "REDIS_PASSWORD must not use a predictable value" >&2
            exit 1
            ;;
        esac
        if [ "$${#password}" -lt 16 ]; then
          echo "REDIS_PASSWORD must contain at least 16 characters" >&2
          exit 1
        fi
        case "$${password}" in
          *[!A-Za-z0-9._~-]*)
            echo "REDIS_PASSWORD must contain only URL-safe characters" >&2
            exit 1
            ;;
        esac
        umask 077
        config=/run/redis-hotelcarepro.conf
        {
          printf 'bind 0.0.0.0\n'
          printf 'protected-mode yes\n'
          printf 'appendonly yes\n'
          printf 'maxmemory 256mb\n'
          printf 'maxmemory-policy allkeys-lru\n'
          printf 'requirepass %s\n' "$${password}"
        } > "$${config}"
        chown redis:redis "$${config}"
        unset password normalized REDIS_PASSWORD
        exec /usr/local/bin/docker-entrypoint.sh redis-server "$${config}"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -qx PONG"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - redis-network

  backend:
    build: 
      context: ./backend/myLubd
      dockerfile: Dockerfile
    container_name: django-backend
    restart: unless-stopped
    volumes:
      - ./backend/myLubd/src:/app/src
      - static_volume:/app/static
      - media_volume:/app/media
      - backup_volume:/root/my_project/backend/backups
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: myLubd.settings
      PYTHONPATH: /app
      DEBUG: 0
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set a strong DJANGO_SECRET_KEY of at least 50 characters}
      DJANGO_ALLOWED_HOSTS: localhost 127.0.0.1 [::1] ${DOMAIN} www.${DOMAIN} django-backend backend
      DJANGO_CORS_ORIGINS: https://${DOMAIN} https://www.${DOMAIN}
      DJANGO_CSRF_TRUSTED_ORIGINS: https://${DOMAIN} https://www.${DOMAIN}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      AUTH0_ISSUER: ${AUTH0_ISSUER}
      AUTH0_ISSUER_BASE_URL: ${AUTH0_ISSUER_BASE_URL}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE}
      AUTH0_CLAIM_NAMESPACE: ${AUTH0_CLAIM_NAMESPACE:-https://hotelcarepro.com}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID}
      AUTH0_CLIENT_SECRET: ${AUTH0_CLIENT_SECRET}
      AUTH0_SECRET: ${AUTH0_SECRET}
      SQL_ENGINE: django.db.backends.postgresql
      SQL_DATABASE: ${SQL_DATABASE}
      SQL_USER: ${SQL_USER}
      # PostgreSQL and Django must consume the same explicitly supplied secret.
      SQL_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to an explicit database password}
      SQL_HOST: ${SQL_HOST}
      SQL_PORT: ${SQL_PORT}
      POSTGRES_DB: ${POSTGRES_DB:-mylubd_db}
      POSTGRES_USER: ${POSTGRES_USER:-mylubd_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to an explicit database password}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL}
      SERVER_EMAIL: ${SERVER_EMAIL}
      EMAIL_REQUIRE_AUTH: ${EMAIL_REQUIRE_AUTH}
      DAILY_SUMMARY_RECIPIENTS: ${DAILY_SUMMARY_RECIPIENTS}
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET}
      GMAIL_REFRESH_TOKEN: ${GMAIL_REFRESH_TOKEN}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD to a strong URL-safe password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 1
    healthcheck:
      test: ["CMD", "python", "-c", "import http.client; conn = http.client.HTTPConnection('localhost:8000'); conn.request('GET', '/api/v1/health/', headers={'X-Forwarded-Proto': 'https'}); response = conn.getresponse(); exit(0 if response.status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      app-network:
        aliases:
          - backend
          - django-backend
      redis-network:

  db:
    image: postgres:17-alpine
    container_name: db
    restart: unless-stopped
    volumes:
      - postgres_data_v17:/var/lib/postgresql/data/
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mylubd_db}
      POSTGRES_USER: ${POSTGRES_USER:-mylubd_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to an explicit database password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # PostgreSQL is only available inside the Docker network.
    expose:
      - "5432"
    networks:
      - app-network

  nginx:
    image: nginx:stable-alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/cloudflare.conf:/etc/nginx/cloudflare.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - static_volume:/usr/share/nginx/html/static:ro
      - media_volume:/usr/share/nginx/html/media:ro
    environment:
      - NGINX_ENVSUBST_TEMPLATE_SUFFIX=.template
      - DOMAIN=${DOMAIN:-pcms.live}
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      app-network:
        aliases:
          - nginx


networks:
  app-network:
    name: pcms_network
    driver: bridge
  redis-network:
    driver: bridge
    internal: true

volumes:
  postgres_data_v17:
    driver: local
    name: pcms_postgres_data_v17
  redis_data:
    driver: local
    name: pcms_redis_data
  static_volume:
    driver: local
    name: pcms_static_volume
  media_volume:
    driver: local
    name: pcms_media_volume
  backup_volume:
    driver: local
    name: pcms_backup_volume
