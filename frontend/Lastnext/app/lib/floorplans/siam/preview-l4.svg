    .note.unmapped circle { fill:#ef4444; stroke:#991b1b }
    .note.unmapped text { fill:#991b1b }
    .note.excluded circle { fill:#6b7280; stroke:#111827 }
    .note.excluded text { fill:#111827 }
  </style>
