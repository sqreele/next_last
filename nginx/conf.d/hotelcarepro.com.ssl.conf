# Retired HotelCarePro domain: preserve the TLS endpoint solely to redirect
# every request to the canonical StayMaint origin.
server {
    listen 80;
    listen [::]:80;
    server_name hotelcarepro.com www.hotelcarepro.com;

    return 301 https://staymaint.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hotelcarepro.com www.hotelcarepro.com;

    # Keep the existing Cloudflare Origin certificate so HTTPS requests can
    # receive the canonical-domain redirect before reaching any application.
    ssl_certificate     /etc/nginx/ssl/origin.crt;
    ssl_certificate_key /etc/nginx/ssl/origin.key;

    return 301 https://staymaint.com$request_uri;
}
