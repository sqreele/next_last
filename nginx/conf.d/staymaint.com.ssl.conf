server {
    listen 80;
    listen [::]:80;
    server_name staymaint.com www.staymaint.com;

    return 301 https://staymaint.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.staymaint.com;

    ssl_certificate     /etc/nginx/ssl/staymaint-origin.crt;
    ssl_certificate_key /etc/nginx/ssl/staymaint-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://staymaint.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name staymaint.com;

    ssl_certificate     /etc/nginx/ssl/staymaint-origin.crt;
    ssl_certificate_key /etc/nginx/ssl/staymaint-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Use Docker's DNS resolver at request time so application containers can
    # be recreated without restarting Nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $frontend_upstream http://frontend:3000;
    set $backend_upstream http://backend:8000;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    client_max_body_size 10M;

    # Reject common CMS, CGI, and PHP exploit probes at the edge. StayMaint
    # serves no PHP routes; legitimate application and PWA paths are excluded.
    location = /wp-admin { return 404; }
    location ^~ /wp-admin/ { return 404; }
    location ^~ /wp-includes/ { return 404; }
    location ^~ /wp-content/ { return 404; }
    location ^~ /wordpress/ { return 404; }
    location ^~ /blog/wp- { return 404; }
    location ^~ /cgi-bin/ { return 404; }
    location ~* ^/(?:vendor/)?phpunit(?:/|$) { return 404; }
    location ~* \.php(?:/|$) { return 404; }

    location /_next/image {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_pass $frontend_upstream;
    }

    location ^~ /_next/static/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        expires 1y;
        proxy_pass $frontend_upstream;
    }

    location ^~ /_next/data/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_pass $frontend_upstream;
    }

    # Shared Django/Nginx media and static volumes.
    location ^~ /media/ {
        alias /usr/share/nginx/html/media/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, no-transform";
        autoindex off;
    }

    location /static/ {
        alias /usr/share/nginx/html/static/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, no-transform";
        try_files $uri $uri/ =404;
    }

    # Auth0's callback and transaction routes are owned by Next.js.
    location ^~ /api/auth/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_redirect off;
        proxy_pass $frontend_upstream;
    }

    location ^~ /api/v1/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_pass $backend_upstream;
    }

    location ^~ /admin/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_pass $backend_upstream;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_pass $frontend_upstream;
    }

    # Hide sensitive dotfiles while preserving ACME/security endpoints.
    location ~ /\.(?!well-known(?:/|$)) {
        return 404;
        access_log off;
        log_not_found off;
    }
}
